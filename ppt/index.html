<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>周何的 PPT 模板工坊</title>
<meta name="theme-color" content="#7c3aed">
<style>
:root{--p:#7c3aed;--p2:#a78bfa;--bg:#f5f4fa;--card:#fff;--txt:#1e1b2e;--mut:#6b6880}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}
.wrap{max-width:1080px;margin:0 auto;padding:24px 16px 60px}
header{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.logo{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,var(--p),var(--p2));display:flex;align-items:center;justify-content:center;font-size:24px;flex:none}
h1{font-size:22px}h1 small{display:block;font-size:12px;color:var(--mut);font-weight:normal;margin-top:2px}
.sub{color:var(--mut);font-size:13.5px;margin-bottom:18px}
.cats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{padding:7px 14px;border-radius:999px;border:1.5px solid #e5e0f5;background:#fff;font-size:13.5px;cursor:pointer;user-select:none}
.chip.on{background:var(--p);border-color:var(--p);color:#fff}
.chip:not(.on):hover{border-color:var(--p2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.tcard{background:var(--card);border-radius:14px;overflow:hidden;box-shadow:0 2px 12px rgba(124,58,237,.08);cursor:pointer;transition:.15s;border:1.5px solid transparent}
.tcard:hover{transform:translateY(-3px);border-color:var(--p2)}
.thumb{aspect-ratio:16/9;overflow:hidden;position:relative}
.thumb .slide{transform-origin:top left;width:640px;position:absolute;top:0;left:0}
.tmeta{padding:10px 12px}
.tmeta b{font-size:14.5px}
.tmeta p{font-size:12px;color:var(--mut);margin-top:3px}
.slide{aspect-ratio:16/9;container-type:size;background:var(--bg);color:var(--fg);position:relative;overflow:hidden;font-family:var(--sfont);display:flex;flex-direction:column}
.slide .deco-band{position:absolute;top:0;left:0;width:100%;height:4cqw;background:linear-gradient(90deg,var(--ac),var(--ac2))}
.slide .deco-corner{position:absolute;right:-8cqw;bottom:-14cqw;width:34cqw;height:34cqw;border-radius:50%;background:var(--ac);opacity:.08}
.slide .deco-dots{position:absolute;top:5cqw;right:5cqw;width:14cqw;height:5cqw;background-image:radial-gradient(var(--ac) 1px,transparent 1.4px);background-size:2.4cqw 2.4cqw;opacity:.5}
.slide .pagenum{position:absolute;bottom:3cqw;right:4cqw;font-size:2.2cqw;color:var(--mut2)}
.slide .inner{flex:1;padding:6cqw 7cqw;display:flex;flex-direction:column;min-height:0}
.kicker{font-size:2.4cqw;letter-spacing:.4cqw;color:var(--ac);font-weight:700;margin-bottom:2cqw}
.s-title{font-size:5.6cqw;font-weight:800;line-height:1.25}
.s-sub{font-size:2.8cqw;color:var(--mut2);margin-top:2cqw}
.s-who{margin-top:auto;font-size:2.4cqw;color:var(--mut2)}
.big-num{font-size:16cqw;font-weight:800;color:var(--ac);opacity:.9;line-height:1}
ol.toc{list-style:none;margin-top:3cqw}
ol.toc li{font-size:3.2cqw;padding:1.6cqw 0;border-bottom:1px solid color-mix(in srgb,var(--fg) 12%,transparent);display:flex;gap:2cqw;align-items:baseline}
ol.toc li b{color:var(--ac);font-size:3cqw}
.body-list{margin-top:3cqw;display:flex;flex-direction:column;gap:2.2cqw}
.body-list .li{display:flex;gap:2cqw;align-items:flex-start;font-size:3cqw;line-height:1.55}
.body-list .li::before{content:"";flex:none;width:1.6cqw;height:1.6cqw;border-radius:50%;background:var(--ac);margin-top:1.1cqw}
.body-text{margin-top:3cqw;font-size:3.1cqw;line-height:1.9;text-indent:2em}
.two{display:grid;grid-template-columns:1fr 1fr;gap:4cqw;margin-top:3cqw}
.two .col{background:color-mix(in srgb,var(--ac) 7%,transparent);border-radius:2cqw;padding:3cqw;font-size:2.7cqw;line-height:1.7}
.two .col b{display:block;color:var(--ac);margin-bottom:1.4cqw;font-size:3cqw}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:3cqw;margin-top:4cqw}
.stat{background:color-mix(in srgb,var(--ac) 8%,transparent);border-radius:2cqw;padding:3.4cqw 2cqw;text-align:center}
.stat b{display:block;font-size:7cqw;color:var(--ac);line-height:1.1}
.stat span{font-size:2.4cqw;color:var(--mut2)}
blockquote{margin:auto 0;font-size:4.6cqw;line-height:1.7;font-weight:700}
blockquote::before{content:"“";color:var(--ac);font-size:8cqw;display:block;line-height:.6}
.attr{margin-top:3cqw;font-size:2.6cqw;color:var(--mut2);text-align:right}
.endmsg{margin:auto;text-align:center}
.endmsg b{font-size:9cqw;font-weight:800;color:var(--ac)}
.endmsg p{margin-top:2cqw;font-size:3cqw;color:var(--mut2)}
#editor{display:none}
#editor.on{display:block}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.tb{padding:9px 14px;border-radius:10px;border:1.5px solid #e5e0f5;background:#fff;cursor:pointer;font-size:13.5px}
.tb:hover{border-color:var(--p2)} .tb.prime{background:var(--p);border-color:var(--p);color:#fff;font-weight:600}
.thumbbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.pgbtn{padding:6px 10px;border-radius:8px;border:1.5px solid #e5e0f5;background:#fff;cursor:pointer;font-size:12px}
.pgbtn.on{background:var(--p);border-color:var(--p);color:#fff}
#slideBox{border-radius:14px;overflow:hidden;box-shadow:0 4px 20px rgba(30,27,46,.12)}
#slideBox .slide{width:100%}
[contenteditable]{outline:none}
[contenteditable]:focus{background:color-mix(in srgb,var(--ac) 8%,transparent);border-radius:.6cqw}
.hint{font-size:12.5px;color:var(--mut);margin-top:8px;line-height:1.7}
body.present .wrap,body.present #editor{display:none}
#present{display:none;position:fixed;inset:0;background:#000;z-index:50}
body.present #present{display:block}
#present .slide{position:absolute;inset:0;width:100%;height:100%}
#present .slide:not(.cur){display:none}
#pHint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);color:#ffffff88;font-size:12px;z-index:60}
#aiPanel{display:none;margin-bottom:12px}
#aiPanel.on{display:block}
#aiPanel textarea,#aiPanel input{width:100%;padding:11px;border:1.5px solid #e5e0f5;border-radius:10px;font-size:14px;font-family:inherit;outline:none;margin-top:8px}
#aiPanel textarea{min-height:70px;resize:vertical}
#aiPanel textarea:focus,#aiPanel input:focus{border-color:var(--p2)}
.airow{display:flex;gap:8px;align-items:center;margin-top:8px}
.airow input{flex:1;margin-top:0}
#lock{position:fixed;inset:0;background:rgba(30,27,46,.6);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:99}
#lock .box{background:#fff;border-radius:18px;padding:26px;width:min(340px,88vw);text-align:center}
#lock input{width:100%;padding:12px;border:1.5px solid #e5e0f5;border-radius:12px;font-size:16px;text-align:center;outline:none;margin:10px 0}
#lock button{width:100%;padding:12px;border:none;border-radius:12px;background:var(--p);color:#fff;font-size:15px;font-weight:600;cursor:pointer}
#lockmsg{font-size:12.5px;color:#dc2626;min-height:18px;margin-top:8px}
#err{display:none;margin-top:10px;font-size:13.5px;color:#dc2626;background:#fef2f2;border-radius:10px;padding:10px;line-height:1.6}
</style>
</head>
<body>
<div id="lock">
  <div class="box">
    <div class="logo" style="width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,var(--p),var(--p2));display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto 10px">🎨</div>
    <div style="font-weight:600">周何的 PPT 模板工坊</div>
    <div style="font-size:12.5px;color:#6b6880;margin-top:4px">AI 功能需要解锁（与润色助手同密码）</div>
    <input id="pwd" type="password" placeholder="访问密码">
    <button id="unlock">解锁</button>
    <div id="lockmsg"></div>
  </div>
</div>

<div class="wrap">
<header>
  <div class="logo">🎨</div>
  <div><h1>周何的 PPT 模板工坊<small>选模板 · AI 填内容 · 演示 / 导出 PDF / 导出 PPTX</small></h1></div>
</header>
<p class="sub">全部模板本地渲染，浏览器全屏演示；文字点击即可修改；导出支持 PDF 与 PPTX。</p>

<div id="home">
  <div class="cats" id="cats"></div>
  <div class="grid" id="grid"></div>
</div>

<div id="editor">
  <div class="toolbar">
    <button class="tb" id="backBtn">← 返回模板列表</button>
    <button class="tb prime" id="presentBtn">▶ 全屏演示</button>
    <button class="tb" id="aiBtn">🤖 AI 填充内容</button>
    <button class="tb" id="pdfBtn">🖨 导出 PDF</button>
    <button class="tb" id="pptxBtn">📦 导出 PPTX</button>
    <button class="tb" id="resetBtn">↺ 重置为模板</button>
  </div>
  <div id="aiPanel">
    <div style="background:#fff;border-radius:14px;padding:16px;border:1.5px solid #e5e0f5">
      <div style="font-size:13px;color:#6b6880;margin-bottom:4px">输入主题（必填），AI 会按当前模板的页面结构自动生成全部内容</div>
      <input id="aiTopic" placeholder="如：写生实践汇报 / 班级期中总结 / 新媒体运营入门分享">
      <textarea id="aiNote" placeholder="补充要求（可选）：如“重点讲踩过的坑”“加入具体数据”“语气轻松一点”"></textarea>
      <div class="airow">
        <input id="aiWho" placeholder="汇报人（显示在封面）">
        <button class="tb prime" id="aiGo">🤖 开始生成</button>
      </div>
      <div id="err"></div>
    </div>
  </div>
  <div class="thumbbar" id="thumbbar"></div>
  <div id="slideBox"></div>
  <div class="hint">💡 编辑模式：直接点击幻灯片里的文字即可修改（改完自动保存草稿）；演示模式：← → 方向键翻页，Esc 退出。</div>
</div>
</div>

<div id="present"><div id="pslides"></div><div id="pHint">← → 翻页 · Esc 退出</div></div>

<script>
/* ================= 主题 ================= */
const THEMES={
 academic:{name:"学术蓝",bg:"#f5f8ff",fg:"#1a2b4a",mut2:"#5b6b8c",ac:"#2563eb",ac2:"#7aa5f8",font:"sans",deco:"dots"},
 deepnavy:{name:"深空蓝",bg:"#0e1a2f",fg:"#e8eefb",mut2:"#8fa3c4",ac:"#5b9dff",ac2:"#2e5ea8",font:"sans",deco:"band",dark:true},
 fresh:{name:"清新绿",bg:"#f2faf4",fg:"#1c4a2c",mut2:"#5f8a70",ac:"#0f9d58",ac2:"#7fd6a4",font:"sans",deco:"corner"},
 energy:{name:"活力橙",bg:"#fff8f0",fg:"#4a2c0f",mut2:"#9a7b57",ac:"#f97316",ac2:"#fdba74",font:"sans",deco:"dots"},
 pink:{name:"温柔粉",bg:"#fdf5f8",fg:"#4a1f33",mut2:"#a0788d",ac:"#db2777",ac2:"#f9a8c9",font:"sans",deco:"corner"},
 mono:{name:"简约黑白",bg:"#ffffff",fg:"#171717",mut2:"#6b6b6b",ac:"#171717",ac2:"#a3a3a3",font:"sans",deco:"band"},
 darktech:{name:"科技暗黑",bg:"#0f1220",fg:"#e4e8f7",mut2:"#7d86a8",ac:"#22d3ee",ac2:"#6366f1",font:"sans",deco:"dots",dark:true},
 guochao:{name:"国潮红",bg:"#fff7f2",fg:"#5a1a10",mut2:"#a3705f",ac:"#c0392b",ac2:"#e8a87c",font:"serif",deco:"corner"},
 magazine:{name:"杂志米棕",bg:"#faf6ef",fg:"#33291c",mut2:"#8a7a63",ac:"#a16207",ac2:"#d6b98c",font:"serif",deco:"band"},
 mint:{name:"薄荷青",bg:"#f0fafb",fg:"#0f3d42",mut2:"#5f8f95",ac:"#0891b2",ac2:"#7dd3d8",font:"sans",deco:"dots"}
};
const FONT={sans:'"PingFang SC","Microsoft YaHei",sans-serif',serif:'"Songti SC","STSong","SimSun",serif'};

/* ================= 页面构造 ================= */
const P={
 cover:(title,sub,who)=>({layout:"cover",title,sub,who}),
 toc:(title,items)=>({layout:"toc",title,items}),
 sec:(n,title)=>({layout:"section",n,title}),
 list:(title,items)=>({layout:"list",title,items}),
 text:(title,body)=>({layout:"text",title,body}),
 two:(title,c1,c2)=>({layout:"two",title,c1,c2}),
 stats:(title,stats)=>({layout:"stats",title,stats}),
 quote:(q,a)=>({layout:"quote",q,a}),
 end:(msg)=>({layout:"end",msg})
};

/* ================= 模板库 ================= */
const TPL=[
 {id:"kecheng",name:"课程作业汇报",cat:"课程学习",theme:"academic",deco:"dots",
  pages:[P.cover("《新媒体数据分析》课程作业汇报","数据驱动的校园媒体运营观察","网媒2502班 · 周何"),
   P.toc("目录",["选题背景与思路","数据来源与方法","分析结果","问题与反思","下一步计划"]),
   P.sec("01","选题背景与思路"),
   P.list("选题背景",["校园公众号阅读量近三月持续下滑","同类高校账号均有爆款案例","希望用数据找到破局点","结合课程所学分析方法"]),
   P.two("分析方法","数据来源","公众号后台近90天数据\n问卷星回收问卷 137 份\n3 位运营成员的深度访谈","描述统计+交叉分析\n文本情感分析\n对照爆款案例复盘"),
   P.stats("关键数据",[{b:"137",d:"回收问卷"},{b:"-32%",d:"阅读量降幅"},{b:"3类",d:"高互动内容"}]),
   P.text("问题与反思","样本以本班同学为主，代表性有限；情感分析的准确率依赖人工校对；下一步将扩大样本并引入更多维度的交叉验证。"),
   P.end("谢谢观看","欢迎老师和同学们批评指正")]},
 {id:"xiesheng",name:"写生实践汇报",cat:"课程学习",theme:"fresh",deco:"corner",
  pages:[P.cover("写生实践汇报","从教室走向真实的田野","网媒2502班 · 周何"),
   P.toc("目录",["写生行程回顾","作品与收获","遇到的问题","同学反馈","总结与展望"]),
   P.list("写生行程回顾",["Day1 抵达驻地，踩点取景","Day2-4 分组外出写生与采访","Day5 素材整理与初稿","全程共完成作品 23 幅、采访音频 9 段"]),
   P.two("最大收获","踩过的坑","学会在真实场景里找选题\n画面叙事能力明显提升\n和陌生采访对象破冰的技巧","第一天设备没电白跑一趟\n取景时忽略了光线方向\n下次要提前一天检查设备清单"),
   P.quote("最好的选题不在教室里，而在你愿意多走的那五百米。","写生手记"),
   P.end("感谢相遇","期待下一次出发")]},
 {id:"banzhang",name:"班级工作总结",cat:"班级事务",theme:"energy",deco:"dots",
  pages:[P.cover("班级工作期中总结","网媒2502班 · 班长周何","汇报人：周何"),
   P.toc("汇报提纲",["班级整体情况","已完成的重点工作","存在的问题","下阶段计划"]),
   P.stats("班级概况",[{b:"34",d:"班级人数"},{b:"98%",d:"关键通知触达"},{b:"12",d:"组织活动场次"}]),
   P.list("已完成的重点工作",["建立班级通知三级触达机制（群公告+接龙+私聊提醒）","组织写生集体出行，全程零安全事故","搭建班费公示制度，每月 1 号公开明细","配合辅导员完成 3 次材料收集，按时率 100%"]),
   P.text("存在的问题","部分同学参与积极性不高，活动报名常集中在少数人；宿舍之间的熟悉度还不均衡；个别通知的反馈时间偏长，需要在形式上做优化。"),
   P.list("下阶段计划",["推行活动轮值制，让每个人都有参与感","以宿舍为单位开展小型团建","重要通知增加截止前 24 小时的二次提醒","建立班级意见匿名收集箱"]),
   P.end("感谢辅导员的指导","也谢谢每一位配合工作的同学")]},
 {id:"ziwo",name:"自我介绍",cat:"个人展示",theme:"pink",deco:"corner",
  pages:[P.cover("你好，我是周何","一个爱折腾的网络与新媒体学生","网媒2502班"),
   P.list("关于我",["网媒2502班班长","平时喜欢拍视频、剪片子","正在自学数据分析","座右铭：先完成，再完美"]),
   P.stats("关键词",[{b:"班长",d:"我的角色"},{b:"剪辑",d:"我的爱好"},{b:"数据",d:"我的方向"}]),
   P.two("我能带来什么","我期待什么","班级事务的组织与协调\n活动策划与执行\n新媒体内容的制作经验","认识更多有趣的同学\n一起做有意思的项目\n互相学习共同成长"),
   P.end("很高兴认识大家","期待和你们的每一次合作")]},
 {id:"zhaoxin",name:"社团招新",cat:"活动策划",theme:"mint",deco:"dots",
  pages:[P.cover("新媒体运营社 · 招新啦","在这里，把创意变成作品","无需经验 · 只要热爱"),
   P.list("加入我们你会得到",["从 0 到 1 的公众号运营实战","剪映/PS/数据分析工具培训","一群志同道合的伙伴","优秀作品可推荐校内平台展播"]),
   P.stats("往届成绩",[{b:"3w+",d:"单篇最高阅读"},{b:"15+",d:"产出作品"},{b:"100%",d:"成员实践证明"}]),
   P.two("适合谁加入","你只需要","对新媒体有好奇心\n愿意花时间学习和练习\n有责任心，能参与每周例会","带上热情来就行\n零基础没关系，我们有完整培养路径\n大二大三同样欢迎"),
   P.end("扫码或私聊报名","期待与你在招新现场相遇")]},
 {id:"jingpin",name:"评优/竞聘答辩",cat:"个人展示",theme:"mono",deco:"band",
  pages:[P.cover("竞聘答辩","网媒2502班班长 · 连任申请","答辩人：周何"),
   P.toc("答辩提纲",["过去一年做了什么","数据与结果","不足与反思","如果继续连任"]),
   P.stats("一年成绩单",[{b:"120+",d:"发布通知"},{b:"12场",d:"组织活动"},{b:"0",d:"重大失误"}]),
   P.list("数据背后",["建立通知三级触达机制，触达率稳定在 98% 以上","全年组织活动 12 场，覆盖学习/团建/志愿三大类","班费收支每月公示，全年账目可追溯","配合学院完成各类材料收集，按时率 100%"]),
   P.text("不足与反思","活动参与面还不够广，存在“熟面孔”现象；对个别同学的关注不够；下一步将推动活动轮值与意见匿名箱制度。"),
   P.quote("班长不是一个头衔，而是 34 个人的默认信任。","我的竞聘宣言"),
   P.end("恳请各位支持","无论结果如何，服务不会停")]},
 {id:"dushu",name:"读书分享",cat:"个人展示",theme:"magazine",deco:"band",

/* ================= 幻灯片渲染 ================= */
let DECO="dots",THEME="academic",TPLNAME="",EDIT=false;
let curTpl=null,curPages=null,curIdx=0,apiKey=localStorage.getItem("bw_key")||"";
function themeVars(t){const th=THEMES[t];return `--bg:${th.bg};--fg:${th.fg};--mut2:${th.mut2};--ac:${th.ac};--ac2:${th.ac2};--sfont:${FONT[th.font]}`}
function esc(s){return String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function E(path){return EDIT?` contenteditable="true" data-path="${path}"`:""}

function slideHTML(pg,i,total,editable){
  const num=`<div class="pagenum">${i+1} / ${total}</div>`;
  const deco={band:`<div class="deco-band"></div>`,corner:`<div class="deco-corner"></div>`,dots:`<div class="deco-dots"></div>`}[DECO]||"";
  let body="";
  switch(pg.layout){
    case "cover":
      body=`<div class="inner" style="justify-content:center">
        <div class="kicker">PRESENTATION</div>
        <div class="s-title"${E("title")}>${esc(pg.title)}</div>
        <div class="s-sub"${E("sub")}>${esc(pg.sub)}</div>
        <div class="s-who"${E("who")}>${esc(pg.who)}</div></div>`;break;
    case "toc":
      body=`<div class="inner"><div class="kicker">CONTENTS</div>
        <div class="s-title"${E("title")}>${esc(pg.title)}</div>
        <ol class="toc">${(pg.items||[]).map((it,k)=>`<li><b>${String(k+1).padStart(2,"0")}</b><span${E("items."+k)}>${esc(it)}</span></li>`).join("")}</ol></div>`;break;
    case "section":
      body=`<div class="inner" style="justify-content:center"><div class="big-num">${esc(pg.n||"")}</div>
        <div class="s-title"${E("title")}>${esc(pg.title)}</div></div>`;break;
    case "list":
      body=`<div class="inner"><div class="s-title"${E("title")}>${esc(pg.title)}</div>
        <div class="body-list">${(pg.items||[]).map((it,k)=>`<div class="li"><span${E("items."+k)}>${esc(it)}</span></div>`).join("")}</div></div>`;break;
    case "text":
      body=`<div class="inner"><div class="s-title"${E("title")}>${esc(pg.title)}</div>
        <div class="body-text"${E("body")}>${esc(pg.body)}</div></div>`;break;
    case "two":{
      const p1=(pg.c1||"").split("\n"),p2=(pg.c2||"").split("\n");
      body=`<div class="inner"><div class="s-title"${E("title")}>${esc(pg.title)}</div>
        <div class="two"><div class="col"><b${E("c1h")}>${esc(p1[0])}</b><span${E("c1")}>${esc(p1.slice(1).join("\n"))}</span></div>
        <div class="col"><b${E("c2h")}>${esc(p2[0])}</b><span${E("c2")}>${esc(p2.slice(1).join("\n"))}</span></div></div></div>`;break}
    case "stats":
      body=`<div class="inner"><div class="s-title"${E("title")}>${esc(pg.title)}</div>
        <div class="stats">${(pg.stats||[]).map((st,k)=>`<div class="stat"><b${E("stats."+k+".b")}>${esc(st.b)}</b><span${E("stats."+k+".d")}>${esc(st.d)}</span></div>`).join("")}</div></div>`;break;
    case "quote":
      body=`<div class="inner"><blockquote${E("q")}>${esc(pg.q)}</blockquote><div class="attr"${E("a")}>—— ${esc(pg.a)}</div></div>`;break;
    case "end":
      body=`<div class="inner"><div class="endmsg"><b${E("title")}>${esc(pg.title||"谢谢观看")}</b><p${E("msg")}>${esc(pg.msg)}</p></div></div>`;break;
    default:
      body=`<div class="inner"><div class="s-title"${E("title")}>${esc(pg.title)}</div><div class="body-text"${E("body")}>${esc(pg.body)}</div>`;
  }
  return `<div class="slide" style="${themeVars(THEME)}">${deco}<div class="kicker" style="position:absolute;top:3cqw;left:7cqw;opacity:.7">${esc(TPLNAME)}</div>${body}${num}</div>`;
}

let curCat="全部";
function renderGallery(){
  const grid=document.getElementById("grid");grid.innerHTML="";
  TPL.filter(x=>curCat==="全部"||x.cat===curCat).forEach(t=>{
    const saveD=DECO,saveT=THEME,saveN=TPLNAME,saveE=EDIT;
    DECO=t.deco;THEME=t.theme;TPLNAME=t.name;EDIT=false;
    const card=document.createElement("div");card.className="tcard";
    const th=document.createElement("div");th.className="thumb";
    th.innerHTML=slideHTML(t.pages[0],0,t.pages.length,false);
    const sl=th.querySelector(".slide");
    const scale=(th.clientWidth||240)/640;
    sl.style.transform="scale("+scale+")";sl.style.transformOrigin="top left";sl.style.width="640px";
    const meta=document.createElement("div");meta.className="tmeta";
    meta.innerHTML="<b>"+t.name+"</b><p>"+t.cat+" · "+t.pages.length+" 页 · "+THEMES[t.theme].name+"</p>";

    card.onclick=()=>openDeck(t.id);

    DECO=saveD;THEME=saveT;TPLNAME=saveN;EDIT=saveE;

function openDeck(id){
  curTpl=TPL.find(x=>x.id===id);
  THEME=curTpl.theme;DECO=curTpl.deco;TPLNAME=curTpl.name;
  const draft=localStorage.getItem("ppt_draft_"+id);
  curPages=draft?JSON.parse(draft):JSON.parse(JSON.stringify(curTpl.pages));
  document.getElementById("home").style.display="none";
  document.getElementById("editor").classList.add("on");
  curIdx=0;EDIT=false;renderCur();renderThumbs();
  if(draft)toast("已自动恢复你上次编辑的草稿");
}
function backHome(){document.getElementById("editor").classList.remove("on");document.getElementById("home").style.display="block";curTpl=null;renderGallery()}
function renderCur(){
  const box=document.getElementById("slideBox");
  box.innerHTML=slideHTML(curPages[curIdx],curIdx,curPages.length,EDIT);
  if(EDIT)box.querySelectorAll("[data-path]").forEach(el=>{
    el.addEventListener("input",()=>{setPath(curPages[curIdx],el.dataset.path,el.innerText);saveDraftSoon()});
  });
}
function renderThumbs(){
  const bar=document.getElementById("thumbbar");bar.innerHTML="";
  curPages.forEach((pg,i)=>{const b=document.createElement("button");b.className="pgbtn"+(i===curIdx?" on":"");
    b.textContent=(i+1)+" · "+(pg.title||pg.msg||pg.layout);
    b.onclick=()=>{curIdx=i;renderCur();renderThumbs()};bar.appendChild(b)});
}
function setPath(obj,path,val){
  const parts=path.split(".");let o=obj;
  for(let i=0;i<parts.length-1;i++){o=(Array.isArray(o)?o[+parts[i]]:o[parts[i]])}
  const last=parts[parts.length-1];
  if(Array.isArray(o))o[+last]=val;else o[last]=val;
  saveDraftSoon();
}
let draftTimer=null;
function saveDraftSoon(){clearTimeout(draftTimer);draftTimer=setTimeout(()=>{if(curTpl)localStorage.setItem("ppt_draft_"+curTpl.id,JSON.stringify(curPages))},500)}

/* ================= 演示 ================= */
function startPresent(){
  presentOn=true;document.body.classList.add("present");
  const ps=document.getElementById("pslides");ps.innerHTML="";
  curPages.forEach((pg,i)=>{const w=document.createElement("div");w.innerHTML=slideHTML(pg,i,curPages.length,false);
    const sl=w.querySelector(".slide");if(i===curIdx)sl.classList.add("cur");ps.appendChild(sl)});
  document.addEventListener("keydown",pKeys);
}
function pKeys(e){
  if(e.key==="ArrowRight"||e.key===" "||e.key==="PageDown")curIdx=Math.min(curPages.length-1,curIdx+1);
  else if(e.key==="ArrowLeft"||e.key==="PageUp")curIdx=Math.max(0,curIdx-1);
  else if(e.key==="Escape"){stopPresent();return}
  else return;
  document.querySelectorAll("#pslides .slide").forEach((sl,i)=>sl.classList.toggle("cur",i===curIdx));
}
function stopPresent(){presentOn=false;document.body.classList.remove("present");document.removeEventListener("keydown",pKeys)}

const te=new TextEncoder(),td=new TextDecoder();
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decryptKey(pwd){
  const km=await crypto.subtle.importKey("raw",te.encode(pwd),"PBKDF2",false,["deriveKey"]);
  const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64d(BLOB.salt),iterations:100000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  return td.decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64d(BLOB.iv)},k,b64d(BLOB.ct)));
}

function callAI(sys,usr){
  return new Promise((res,rej)=>{
    fetch("https://ws-mcyvrepj57llk2up.cn-beijing.maas.aliyuncs.com/compatible-mode/v1/chat/completions",
      {method:"POST",headers:{"Authorization":"Bearer "+apiKey,"Content-Type":"application/json"},
       body:JSON.stringify({model:"deepseek-v4-flash",messages:[{role:"system",content:sys},{role:"user",content:usr}],max_tokens:3000,temperature:0.7})})
    .then(async r=>{
      const d=await r.text();
      if(r.status===429)rej(new Error("触发阿里云限流，等 1-2 分钟再试"));
      else if(r.status===401||r.status===403)rej(new Error("Key 失效或无权限"));
      else if(!r.ok)rej(new Error("HTTP "+r.status+" "+d.slice(0,120)));
      else{try{res(JSON.parse(d).choices[0].message.content)}catch{rej(new Error("返回解析失败"))}}
    }).catch(e=>rej(e));
  });
}

}

document.getElementById("pdfBtn").onclick=()=>{
  const w=window.open("","_blank");
  const slides=curPages.map((pg,i)=>slideHTML(pg,i,curPages.length,false)).join("");
  w.document.write('<html><head><meta charset="utf-8"><title>打印</title><style>@page{size:A4 landscape;margin:0}body{margin:0}.slide{width:100vw;aspect-ratio:16/9;page-break-after:always;container-type:size}</style></head><body>'+slides+'<script>setTimeout(function(){window.print()},600)<\/script></body></html>');
  w.document.close();
};
document.getElementById("pptxBtn").onclick=async()=>{
  const btn=document.getElementById("pptxBtn");
  btn.disabled=true;btn.textContent="⏳ 生成中…";
  try{
    if(!window.PptxGenJS){
      await new Promise((res,rej)=>{const sc=document.createElement("script");
        sc.src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js";
        sc.onload=res;sc.onerror=()=>rej(new Error("pptxgenjs 加载失败，请检查网络"));document.head.appendChild(sc)});
    }
    const th=THEMES[THEME];
    const pptx=new PptxGenJS();pptx.defineLayout({name:"W16x9",width:13.33,height:7.5});pptx.layout="W16x9";
    const fg=th.fg.replace("#",""),ac=th.ac.replace("#",""),mu=th.mut2.replace("#",""),bg=th.bg.replace("#","");
    curPages.forEach(pg=>{
      const sl=pptx.addSlide();sl.background={color:bg};
      const T=(txt,o)=>sl.addText(txt,Object.assign({fontFace:th.font==="serif"?"SimSun":"Microsoft YaHei"},o));
      switch(pg.layout){
        case "cover":
          T(pg.title,{x:0.8,y:2.4,w:11.7,h:1.3,fontSize:40,bold:true,color:fg,align:"center"});
          T(pg.sub,{x:0.8,y:3.8,w:11.7,h:0.6,fontSize:18,color:mu,align:"center"});
          T(pg.who,{x:0.8,y:5.6,w:11.7,h:0.5,fontSize:14,color:mu,align:"center"});break;
        case "toc":
          T(pg.title,{x:0.8,y:0.6,w:8,h:0.8,fontSize:30,bold:true,color:ac});
          T((pg.items||[]).map((it,k)=>(k+1)+". "+it).join("\n"),{x:1,y:1.8,w:10,h:5,fontSize:18,color:fg,lineSpacingMultiple:1.5});break;
        case "section":
          T(pg.n||"",{x:0.8,y:2,w:11.7,h:1.6,fontSize:66,bold:true,color:ac,align:"center"});
          T(pg.title,{x:0.8,y:3.8,w:11.7,h:1,fontSize:30,bold:true,color:fg,align:"center"});break;
        case "list":
          T(pg.title,{x:0.8,y:0.6,w:11.7,h:0.9,fontSize:28,bold:true,color:fg});
          T((pg.items||[]).map(x=>"• "+x).join("\n"),{x:1,y:1.8,w:11.3,h:4.8,fontSize:17,color:fg,lineSpacingMultiple:1.6});break;
        case "text":
          T(pg.title,{x:0.8,y:0.6,w:11.7,h:0.9,fontSize:28,bold:true,color:fg});
          T(pg.body,{x:1,y:1.9,w:11.3,h:4.6,fontSize:16,color:fg,lineSpacingMultiple:1.6});break;
        case "two":{
          const p1=(pg.c1||"").split("\n"),p2=(pg.c2||"").split("\n");
          sl.addText(p1[0]||"",{x:0.9,y:1.7,w:5.6,h:0.6,fontSize:20,bold:true,color:ac});
          T(p1.slice(1).join("\n"),{x:0.9,y:2.4,w:5.6,h:4,fontSize:15,color:fg,lineSpacingMultiple:1.5});
          sl.addText(p2[0]||"",{x:6.9,y:1.7,w:5.6,h:0.6,fontSize:20,bold:true,color:ac});
          T(p2.slice(1).join("\n"),{x:6.9,y:2.4,w:5.6,h:4,fontSize:15,color:fg,lineSpacingMultiple:1.5});break}
        case "stats":
          T(pg.title,{x:0.8,y:0.6,w:11.7,h:0.9,fontSize:28,bold:true,color:fg});
          (pg.stats||[]).forEach((st,k)=>{
            sl.addText(st.b,{x:1+k*4.1,y:2.3,w:3.7,h:1.2,fontSize:48,bold:true,color:ac,align:"center"});
            sl.addText(st.d,{x:1+k*4.1,y:3.6,w:3.7,h:0.5,fontSize:14,color:mu,align:"center"});});break;
        case "quote":
          T("“"+pg.q+"”",{x:1,y:2,w:11.3,h:2.6,fontSize:26,bold:true,color:fg,align:"center"});
          T("—— "+pg.a,{x:1,y:4.8,w:11.3,h:0.5,fontSize:14,color:mu,align:"right"});break;
        default:
          T(pg.title||"谢谢观看",{x:0.8,y:2.2,w:11.7,h:1.4,fontSize:44,bold:true,color:ac,align:"center"});
          if(pg.msg)T(pg.msg,{x:0.8,y:3.9,w:11.7,h:0.6,fontSize:16,color:mu,align:"center"});
      }
    });
    pptx.writeFile({fileName:(curTpl?curTpl.name:"PPT")+".pptx"});
  }catch(e){
    document.getElementById("err").style.display="block";document.getElementById("err").textContent="导出失败："+e.message;
  }finally{btn.disabled=false;btn.textContent="📦 导出 PPTX"}
};

renderCats();renderGallery();
</script>
